# =============================================================================
# GOLDFLOW HIGH-PERFORMANCE NGINX REVERSE PROXY CONFIGURATION
# Supports: Full WebSocket Streaming + Dash Callbacks + Basic Auth Protection
# =============================================================================

# 1. Main HTTP Port 80 (Defaults to Port 8070 Master Terminal)
server {
    listen 80;
    server_name _;

    auth_basic "GoldFlow Cloud Terminal";
    auth_basic_user_file /etc/nginx/.goldflow_htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

